name: DataProof

on:
  push:
    paths:
      - applications/csv-import-verifier-ts/**
      - .github/workflows/dataproof.yml
  pull_request:
    paths:
      - applications/csv-import-verifier-ts/**
      - .github/workflows/dataproof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: applications/csv-import-verifier-ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: applications/csv-import-verifier-ts/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Chromium and system dependencies
        run: npm run browser:install -- --with-deps
      - name: Install and verify the 33 pinned upstream files
        run: npm run spreadsheet:install
      - name: Typecheck, unit tests, and browser E2E tests
        run: npm run check
      - name: Run the documented demo command
        run: npm run demo
      - name: Retain the demo evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dataproof-demo-node-${{ matrix.node }}
          path: applications/csv-import-verifier-ts/output/demo/
          if-no-files-found: warn
          retention-days: 14
